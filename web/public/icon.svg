<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="JoveCanvas icon">
  <defs>
    <linearGradient id="jc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="0.55" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#c026d3" />
    </linearGradient>
  </defs>
  <!-- 渐变圆角底板：保证 16px 小尺寸下依旧清晰可辨 -->
  <rect x="16" y="16" width="368" height="368" rx="92" fill="url(#jc-bg)" />
  <!-- 木星轨道环 -->
  <g transform="rotate(-20 200 232)">
    <ellipse cx="200" cy="232" rx="132" ry="46" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round" stroke-dasharray="520 220" stroke-dashoffset="-60" />
  </g>
  <!-- 白色字母 J -->
  <path d="M 178 96 H 262 V 228 A 74 74 0 0 1 114 228 V 216" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 画布节点 -->
  <circle cx="308" cy="140" r="17" fill="#ffffff" />
</svg>
