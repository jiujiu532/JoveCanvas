<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JoveCanvas logo">
  <!-- High-contrast mark tuned for 24–32px sidebar sizes -->
  <defs>
    <linearGradient id="g" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EA1FF"/>
      <stop offset=".55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="s" x1="14" y1="46" x2="50" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset=".45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Solid tile: reads as color even at 16px -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/>
  <!-- Soft inner panel -->
  <rect x="12" y="12" width="40" height="40" rx="10" fill="#0B1B3A" fill-opacity=".22"/>
  <!-- Grid: short, bold ticks so they survive downscale -->
  <g stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2" stroke-linecap="round">
    <path d="M20 22h24M20 32h24M20 42h16"/>
    <path d="M24 18v28M34 18v28M44 18v20"/>
  </g>
  <!-- Thick creation stroke -->
  <path d="M18 44c8-10 12-18 20-22 6-3 12-1 16 6" fill="none" stroke="url(#s)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 42c7-9 11-16 18-19 5-2.5 10-1 13.5 5" fill="none" stroke="#FFF7ED" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Node -->
  <circle cx="50" cy="28" r="6.5" fill="#F59E0B"/>
  <circle cx="50" cy="28" r="6.5" fill="none" stroke="#FFFBEB" stroke-width="2.2"/>
  <circle cx="48.2" cy="26.2" r="2" fill="#FFFBEB"/>
</svg>
