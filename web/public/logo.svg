<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="JoveCanvas logo" fill="none">
  <defs>
    <linearGradient id="jc-frame" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f2a6b"/>
    </linearGradient>
    <linearGradient id="jc-frame-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="jc-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="jc-core" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="jc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Back canvas sheets (depth / layers) -->
  <g opacity="0.9">
    <rect x="86" y="64" width="228" height="228" rx="36" transform="rotate(8 200 178)" fill="url(#jc-frame-soft)"/>
    <rect x="78" y="72" width="228" height="228" rx="36" transform="rotate(-6 192 186)" fill="url(#jc-frame-soft)" opacity="0.75"/>
  </g>

  <!-- Main canvas frame -->
  <rect x="78" y="78" width="244" height="244" rx="40" fill="url(#jc-frame)"/>
  <!-- Inner well -->
  <rect x="104" y="104" width="192" height="192" rx="28" fill="#071022" opacity="0.22"/>
  <rect x="112" y="112" width="176" height="176" rx="24" fill="url(#jc-core)" opacity="0.35"/>

  <!-- Subtle grid (canvas metaphor) -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round">
    <path d="M148 140 H264"/>
    <path d="M148 176 H264"/>
    <path d="M148 212 H264"/>
    <path d="M148 248 H220"/>
    <path d="M168 128 V260"/>
    <path d="M208 128 V260"/>
    <path d="M248 128 V220"/>
  </g>

  <!-- Creative stroke: golden path across the canvas -->
  <path
    d="M128 248 C158 210 176 168 208 152 C236 138 262 148 278 172"
    stroke="url(#jc-ink)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#jc-glow)"
  />
  <!-- Secondary thinner accent -->
  <path
    d="M140 236 C168 204 184 174 210 162 C232 152 252 160 266 178"
    stroke="#fffbeb"
    stroke-opacity="0.45"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Creation node -->
  <circle cx="278" cy="172" r="20" fill="#f59e0b"/>
  <circle cx="278" cy="172" r="20" stroke="#fff7ed" stroke-width="5"/>
  <circle cx="272" cy="166" r="6" fill="#fffbeb"/>
</svg>
