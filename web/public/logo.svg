<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="JoveCanvas logo">
  <defs>
    <linearGradient id="jc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="0.55" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="jc-orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="1" stop-color="#c026d3" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- 木星轨道环：JoveCanvas 的 Jove（朱庇特/木星）意象 -->
  <g transform="rotate(-20 200 236)">
    <ellipse cx="200" cy="236" rx="158" ry="56" fill="none" stroke="url(#jc-orbit)" stroke-width="14" stroke-linecap="round" stroke-dasharray="640 260" stroke-dashoffset="-70" />
  </g>
  <!-- 字母 J：顶部横梁 + 竖干 + 底部圆钩，画笔笔触式圆头线条 -->
  <path d="M 172 84 H 268 V 232 A 84 84 0 0 1 100 232 V 218" fill="none" stroke="url(#jc-grad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 画布节点：轨道上的创作锚点 -->
  <circle cx="330" cy="150" r="20" fill="url(#jc-grad)" />
</svg>
